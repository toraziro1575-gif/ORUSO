name: Build ORUSO APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create --platforms=android --org com.oruso .

      - name: Configure Firebase Android
        run: |
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()
          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.3" apply false',
                  1,
              )
          settings.write_text(text)

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()
          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1,
              )
          app.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Remove generated test
        run: rm -rf test

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORUSO-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
